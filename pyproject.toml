[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "europa-is"
version = "0.4.0"
description = "Europa Arithmetic Language Model Interpretability Suite"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "torch>=2.11,<3",
    "matplotlib>=3.5,<4",
    "transformer-lens>=3.2.1",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "pydantic>=2.13.4",
    "tomli-w>=1.2,<2",
]

[project.scripts]
eis = "eis.cli:main"
generate = "eis.data.cli:main"
train = "eis.train.cli:main"
evaluate = "eis.eval.cli:main"
config = "eis.config.cli:main"
its-export = "eis.app.export.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.15.10",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/eis", "src/eur_ts", "src/eur_is"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
