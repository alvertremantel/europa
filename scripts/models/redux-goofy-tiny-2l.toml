# Europa ALM-IS training config

[paths]
data_dir = "data/full-dataset"
output_dir = "runs/redux-goofy-tiny-2l"

[runtime]
device = "cuda"
seed = 42

[resume]
resume_from = ""
additional_epochs = ""

[model]
sequence_length = 64
d_model = 24
n_heads = 2
n_layers = 2
mlp_hidden = 32
dropout = 0.05
position_encoding = "fixed_meaning"

[optimization]
batch_size = 32
epochs = 50
learning_rate = 0.0003
weight_decay = 0.1
grad_clip = 0.1

[logging]
log_interval = 500
max_new_tokens = 32

[training]
training_mode = "examples"
training_format = "final_only"
skip_overlong_examples = false
curriculum_name = ""
