# Europa ALM-IS training config
# Fill in every required value before training.
# Empty strings are placeholders; required empty values are rejected.

[paths]
data_dir = "output/datasets/eurdeck-0.3/"
output_dir = "output/models/eur3-tiny-pi/"

[runtime]
device = "cuda"
seed = "42"

[resume]
resume_from = ""       # optional; blank disables explicit resume path
additional_epochs = "" # optional; blank trains for optimization.epochs total

[model]
sequence_length = "64"
d_model = "16"
n_heads = "2"
n_layers = "3"
mlp_hidden = "24"
dropout = "0.05"
position_encoding = "fixed_meaning"  # fixed_meaning

[optimization]
batch_size = "64"
epochs = "100"
learning_rate = "0.0003"
weight_decay = "0.1"
grad_clip = "0.1"

[logging]
log_interval = "500"
max_new_tokens = "32"

[training]
training_mode = "examples"          # token_stream | examples
training_format = "final_only"        # final_only
skip_overlong_examples = "false"
curriculum_name = ""        # optional; blank disables curriculum
